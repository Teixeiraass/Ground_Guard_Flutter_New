name: ground_guard_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0-216.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  page_transition: ^2.1.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  web_socket_channel: ^3.0.3
  google_sign_in: ^6.2.1
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0
  url_launcher: ^6.3.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launch_icon_light.png"
  image_path_ios_dark_transparent: "assets/images/launch_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/images/launch_icon_dark.png"
  desaturate_tinted_to_grayscale_ios: true
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/launch_icon_light.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-Italic.ttf
          weight: 400
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
